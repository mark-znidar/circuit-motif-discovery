[project]
name = "circuit-motif-discovery"
version = "0.1.0"
description = "Graph contrastive learning on LLM attribution graphs for circuit motif discovery"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "torch-geometric>=2.4",
    "circuit-tracer",
    "hdbscan",
    "umap-learn",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "tqdm",
    "rich",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]
